<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Portal - Bus Tracker</title>
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#17a2b8">
    
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6;}
        
        /* Map aur Panel ka design */
        #map { width: 100%; height: 75vh; z-index: 1; }
        
        .info-panel { padding: 25px 20px; background: white; height: 25vh; box-sizing: border-box; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); border-top-left-radius: 25px; border-top-right-radius: 25px; position: relative; z-index: 1000; margin-top: -20px; text-align: center; }
        .status { font-size: 22px; font-weight: 900; margin-bottom: 8px; color: #333; }
        .details { color: #666; font-size: 15px; font-weight: 500; }
        .header-bar { width: 50px; height: 5px; background: #ddd; border-radius: 5px; margin: 0 auto 15px auto; }
    </style>
</head>
<body>

    <!-- Map Yahan Dikhega -->
    <div id="map"></div>
    
    <!-- Neeche ka Info Panel -->
    <div class="info-panel">
        <div class="header-bar"></div>
        <div class="status" id="status-text">🚌 Tracking Bus...</div>
        <div class="details" id="dist-text">Waiting for driver to start route...</div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAiBYBGWj1ieiKC5thPuRrnL9zmMHJXQhE",
            authDomain: "schoolbustracking-d2f2d.firebaseapp.com",
            databaseURL: "https://schoolbustracking-d2f2d-default-rtdb.firebaseio.com",
            projectId: "schoolbustracking-d2f2d",
            storageBucket: "schoolbustracking-d2f2d.firebasestorage.app",
            messagingSenderId: "537002829038",
            appId: "1:537002829038:web:cb55b2a25dfc2f4d4ebfff",
            measurementId: "G-DQCZ4N7YVN"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();

        // 1. Map Initialize karein
        const map = L.map('map').setView([20.5937, 78.9629], 5); 

        // 2. NAYA GOOGLE MAPS LAYER (Jisme saari dukane aur galiyan dikhengi)
        L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20, // Bahut zyada kareeb se dekhne ke liye
            attribution: '© Google Maps'
        }).addTo(map);

        // 3. Bus ka Custom Icon
        const busIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3063/3063822.png',
            iconSize: [45, 45], // Icon thoda bada kiya hai
            iconAnchor: [22, 22]
        });
        
        let busMarker = null;

        // 4. Firebase se Live Location lana
        database.ref('busLocation').on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                const lat = data.lat;
                const lng = data.lng;

                // Agar marker nahi hai toh banayein, warna jagah update karein
                if(!busMarker) {
                    busMarker = L.marker([lat, lng], {icon: busIcon}).addTo(map);
                } else {
                    busMarker.setLatLng([lat, lng]);
                }

                // Map ko bus ke paas le jayein (Zoom level 17 kar diya hai street view ke liye)
                map.setView([lat, lng], 17); 
                
                document.getElementById('status-text').innerText = "🚌 Bus is on the way!";
                document.getElementById('dist-text').innerText = "Live tracking active. Speed and location updating...";
            }
        });
    </script>
</body>
</html>
