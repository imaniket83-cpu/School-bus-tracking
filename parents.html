<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent App - Multi Bus Tracker</title>
    <meta name="theme-color" content="#17a2b8">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6;}
        .auth-container { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 30px 15px; box-sizing: border-box; }
        .auth-box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 100%; max-width: 380px; text-align: center; }
        .auth-box h2 { margin-top: 0; color: #17a2b8; margin-bottom: 5px; }
        
        .input-field { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-primary { background-color: #17a2b8; }
        .btn-warning { background-color: #ffb800; color: #222;}
        .btn-danger { background-color: #dc3545; color: white; margin-top: 10px; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        #dashboard-screen { display: none; padding: 20px; max-width: 400px; margin: auto; }
        .child-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 15px; text-align: left; border-left: 5px solid #17a2b8;}
        .child-card.absent-card { border-left-color: #dc3545; background-color: #fff5f5; }
        .child-name { font-size: 18px; font-weight: bold; color: #333; display: flex; justify-content: space-between;}
        .child-bus { font-size: 14px; color: #666; margin-bottom: 10px; }
        
        #map-screen { display: none; }
        #map { width: 100%; height: 60vh; z-index: 1; }
        .info-panel { padding: 20px; background: white; height: 40vh; box-sizing: border-box; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); border-top-left-radius: 25px; border-top-right-radius: 25px; position: relative; z-index: 1000; margin-top: -20px; text-align: center; overflow-y: auto;}
        .bus-plate { display: inline-block; background: #ffcc00; color: #000; font-weight: bold; padding: 5px 15px; border-radius: 6px; font-size: 15px; border: 2px solid #222; margin-bottom: 10px; }
        
        .driver-box { background: #f8f9fa; border: 1px solid #ddd; padding: 8px 15px; border-radius: 8px; font-size: 14px; color: #444; margin-bottom: 10px; display: none; text-align: center; }
        .driver-box a { color: #007bff; font-weight: bold; text-decoration: none; display: inline-block; margin-left: 5px; }
        
        .status { font-size: 20px; font-weight: 900; color: #17a2b8; }
        .distance-box { background: #e3f2fd; color: #0d47a1; font-weight: bold; padding: 8px; border-radius: 6px; font-size: 15px; margin-top: 10px; display: none; border: 1px solid #bbdefb; }

        #custom-alert { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 99999; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .alert-box { background: white; padding: 30px; border-radius: 15px; text-align: center; width: 100%; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); animation: popIn 0.3s ease-out; border-top: 8px solid #dc3545;}
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .alert-box h2 { color: #dc3545; margin-top: 0; font-size: 24px; }
        .alert-btn { background: #28a745; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; font-weight: bold; width: 100%; margin-top: 15px; cursor: pointer;}
    </style>
</head>
<body>

    <div id="login-screen" class="auth-container">
        <div class="auth-box">
            <h2>👪 Parent Portal</h2>
            <p style="color:#666; font-size:14px; margin-bottom:15px;">Login provided by School Admin</p>
            <input type="number" id="login-phone" class="input-field" placeholder="Registered Mobile Number">
            <input type="password" id="login-pass" class="input-field" placeholder="Password">
            <button class="btn btn-primary" onclick="loginParent()">Login Securely</button>
        </div>
    </div>

    <div id="dashboard-screen">
        <h2 style="color: #333; text-align:center;">My Dashboard</h2>
        <div id="children-list"></div>
        <button class="btn" style="background:#6c757d; margin-top:20px; width:100%;" onclick="logoutParent()">Logout</button>
    </div>

    <div id="map-screen">
        <div id="map"></div>
        <div class="info-panel">
            <h3 style="margin: 0 0 5px 0; color:#333;">🏫 Sandila Public School</h3>
            <p id="shift-info" style="margin:0 0 10px 0; color:#0d47a1; font-weight:bold; font-size:14px;"></p>
            
            <div class="bus-plate" id="display-bus">BUS INFO</div>
            <div class="driver-box" id="driver-info-box">👨‍✈️ Driver: <span id="driver-name-text">--</span> <br> 📞 <a href="#" id="driver-phone-link">Call</a></div>
            <div style="border-top: 2px dashed #eee; margin: 10px 0;"></div>
            <div class="status">Tracking: <span id="display-child-name" style="color:#222;">...</span></div>
            <div class="distance-box" id="live-distance-box">📍 Distance: <span id="dist-value">Calculating...</span></div>
            <div id="dist-text" style="margin-top: 10px;">Fetching status...</div>
            <button class="btn btn-warning" style="margin-top: 15px; width:100%;" onclick="showScreen('dashboard-screen')">🔙 Back to Dashboard</button>
        </div>
    </div>

    <div id="custom-alert">
        <div class="alert-box">
            <h2>🚌 Bus is Here!</h2>
            <p style="color:#444; font-size:16px;">The school bus is very near to your location. Please get ready!</p>
            <button class="alert-btn" onclick="document.getElementById('custom-alert').style.display='none'">OK, I got it</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyAiBYBGWj1ieiKC5thPuRrnL9zmMHJXQhE", 
            authDomain: "schoolbustracking-d2f2d.firebaseapp.com", 
            databaseURL: "https://schoolbustracking-d2f2d-default-rtdb.firebaseio.com", 
            projectId: "schoolbustracking-d2f2d", 
            storageBucket: "schoolbustracking-d2f2d.firebasestorage.app", 
            messagingSenderId: "537002829038", 
            appId: "1:537002829038:web:cb55b2a25dfc2f4d4ebfff" 
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();

        let mapInstance = null; let busMarker = null; 
        let activeBusListener = null; let activeChildListener = null;
        let isAlarmTriggered = false; let stopLat = null; let stopLng = null;
        const ALARM_DISTANCE_METERS = 500; 
        let globalBuses = {}; 

        database.ref('buses').on('value', snap => { globalBuses = snap.val() || {}; });

        window.onload = function() {
            let savedPhone = localStorage.getItem('parentPhone');
            if(savedPhone) { loadDashboard(savedPhone); }
        };

        function showScreen(screenId) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard-screen').style.display = 'none';
            document.getElementById('map-screen').style.display = 'none';
            document.getElementById(screenId).style.display = (screenId === 'login-screen') ? 'flex' : 'block';
            
            if(screenId !== 'map-screen') {
                if(activeBusListener) { database.ref('busLocations/' + activeBusListener).off(); activeBusListener = null; }
                if(activeChildListener) { database.ref('students/' + activeChildListener).off(); activeChildListener = null; }
                document.getElementById('driver-info-box').style.display = 'none'; document.getElementById('live-distance-box').style.display = 'none';
            }
        }

        function loginParent() {
            let phone = document.getElementById('login-phone').value.trim();
            let pass = document.getElementById('login-pass').value.trim();
            if(!phone || !pass) { alert("Enter Phone and Password!"); return; }
            
            database.ref('students').once('value', (snapshot) => {
                let found = false;
                snapshot.forEach((childSnap) => {
                    let data = childSnap.val();
                    if(data.phone === phone && data.password === pass) { found = true; }
                });
                if(found) {
                    localStorage.setItem('parentPhone', phone);
                    loadDashboard(phone);
                } else {
                    alert("Account details incorrect or not registered by school!");
                }
            });
        }

        function loadDashboard(phone) {
            showScreen('dashboard-screen');
            database.ref('students').on('value', (snapshot) => {
                let foundChildren = [];
                snapshot.forEach((childSnap) => {
                    let data = childSnap.val();
                    if(data.phone === phone) { foundChildren.push({...data, id: childSnap.key}); }
                });

                if(foundChildren.length > 0) {
                    let html = "";
                    foundChildren.forEach(kid => {
                        let busName = globalBuses[kid.busId] ? globalBuses[kid.busId].name : kid.busId;
                        
                        // SMART DATE AUTO-RESET LOGIC
                        let todayDate = new Date().toDateString();
                        let isAbsent = false;
                        
                        if(kid.status === 'absent') {
                            if(kid.absentDate === todayDate) {
                                isAbsent = true; 
                            } else {
                                database.ref('students/' + kid.id).update({ status: 'pending', absentDate: null });
                            }
                        }
                        
                        let actionArea = "";
                        if(!kid.stopLat || !kid.stopLng) {
                            actionArea = `
                                <div style="background:#fff3cd; color:#856404; padding:8px; border-radius:5px; margin-bottom:10px; font-size:13px; font-weight:bold;">
                                    ⚠️ Home/Stop Location not set. Setup required for Bus Alarm!
                                </div>
                                <button class="btn btn-warning" style="width:100%;" onclick="saveHomeLocation('${kid.id}')" id="loc-btn-${kid.id}">📍 Set My Stop Location Now</button>
                            `;
                        } else {
                            let leaveBtn = isAbsent 
                                ? `<button class="btn" style="background:#28a745; color:white; margin-top:10px; width:100%;" onclick="markPresent('${kid.id}')">🔄 Cancel Leave (Mark Present)</button>`
                                : `<button class="btn btn-danger" style="width:100%;" onclick="markAbsent('${kid.id}')">❌ Mark Absent Today</button>`;

                            actionArea = `
                                <button class="btn btn-primary" style="width:100%;" onclick="trackChild('${kid.name}', '${kid.busId}', '${kid.id}')" ${isAbsent ? 'disabled style="background:#ccc"' : ''}>📍 Track ${kid.name}'s Bus</button>
                                ${leaveBtn}
                            `;
                        }

                        html += `
                        <div class="child-card ${isAbsent ? 'absent-card' : ''}">
                            <div class="child-name">👦 ${kid.name} ${isAbsent ? '<span style="color:#dc3545; font-size:14px;">(On Leave)</span>' : ''}</div>
                            <div class="child-bus">🚌 Assigned to: ${busName}</div>
                            ${actionArea}
                        </div>`;
                    });
                    document.getElementById('children-list').innerHTML = html;
                }
            });
        }

        function saveHomeLocation(childId) {
            let btn = document.getElementById(`loc-btn-${childId}`);
            btn.innerText = "Fetching GPS...";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    database.ref('students/' + childId).update({
                        stopLat: pos.coords.latitude,
                        stopLng: pos.coords.longitude
                    }).then(() => {
                        alert("Location saved successfully! The 500m geofence alarm is now active.");
                    });
                }, () => { 
                    alert("Please allow Location Permission in your browser!"); 
                    btn.innerText = "📍 Set My Stop Location Now"; 
                }, { enableHighAccuracy: true });
            } else {
                alert("GPS is not supported on this device.");
            }
        }

        function markAbsent(childId) {
            if(confirm("Are you sure you want to mark absent for today?")) {
                let todayDate = new Date().toDateString();
                database.ref('students/' + childId).update({ 
                    status: 'absent',
                    absentDate: todayDate
                });
            }
        }

        function markPresent(childId) {
            if(confirm("Are you sure you want to cancel the leave? Driver will be notified.")) {
                database.ref('students/' + childId).update({ status: 'pending', absentDate: null });
            }
        }

        function logoutParent() {
            database.ref('students').off();
            localStorage.removeItem('parentPhone');
            document.getElementById('login-phone').value = ''; document.getElementById('login-pass').value = '';
            showScreen('login-screen');
        }

        function playAlarm() {
            if(navigator.vibrate) navigator.vibrate([1000, 500, 1000, 500, 1000]);
            let hornSound = new Audio('https://assets.mixkit.co/active_storage/sfx/989/989-preview.mp3');
            hornSound.loop = true;
            let playPromise = hornSound.play();
            if (playPromise !== undefined) { playPromise.catch(e => console.log("Audio blocked", e)); }
            setTimeout(() => { hornSound.pause(); hornSound.currentTime = 0; }, 4500); 
        }

        function trackChild(childName, busId, childId) {
            document.getElementById('display-child-name').innerText = childName;
            document.getElementById('display-bus').innerText = globalBuses[busId] ? globalBuses[busId].name : busId.toUpperCase();
            showScreen('map-screen');
            
            isAlarmTriggered = false; stopLat = null; stopLng = null;

            if(!mapInstance) {
                mapInstance = L.map('map').setView([20.5937, 78.9629], 5); 
                L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20 }).addTo(mapInstance);
            }
            
            const busIcon = L.icon({ iconUrl: 'https://img.icons8.com/color/96/school-bus.png', iconSize: [45, 45], iconAnchor: [22, 22] });
            
            activeChildListener = childId;
            database.ref('students/' + childId).on('value', (snapshot) => {
                const data = snapshot.val();
                if(data) {
                    stopLat = data.stopLat; stopLng = data.stopLng;
                    if(data.status === 'boarded') {
                        document.getElementById('dist-text').innerHTML = "<span style='color:#28a745; font-weight:bold; font-size:18px;'>✅ Boarded (Inside Bus)</span>";
                        document.getElementById('live-distance-box').style.display = 'none'; 
                    } else {
                        document.getElementById('dist-text').innerHTML = "<span style='color:#ffb800; font-weight:bold; font-size:18px;'>⏳ Waiting for Bus</span>";
                        document.getElementById('live-distance-box').style.display = 'block'; 
                    }
                }
            });

            activeBusListener = busId;
            database.ref('busLocations/' + busId).on('value', (snapshot) => {
                const data = snapshot.val();
                if(data) {
                    if(!busMarker) busMarker = L.marker([data.lat, data.lng], {icon: busIcon}).addTo(mapInstance);
                    else busMarker.setLatLng([data.lat, data.lng]);
                    mapInstance.setView([data.lat, data.lng], 17); 
                    
                    if(data.shift) document.getElementById('shift-info').innerText = data.shift; 
                    if(data.driverName && data.driverPhone) {
                        document.getElementById('driver-info-box').style.display = 'block';
                        document.getElementById('driver-name-text').innerText = data.driverName;
                        document.getElementById('driver-phone-link').innerText = data.driverPhone;
                        document.getElementById('driver-phone-link').href = "tel:" + data.driverPhone;
                    }

                    if(stopLat && stopLng) {
                        let distanceInMeters = mapInstance.distance([data.lat, data.lng], [stopLat, stopLng]);
                        let displayDist = distanceInMeters > 1000 ? (distanceInMeters / 1000).toFixed(1) + " km" : Math.round(distanceInMeters) + " meters";
                        document.getElementById('dist-value').innerText = displayDist + " away";

                        if (distanceInMeters <= ALARM_DISTANCE_METERS && !isAlarmTriggered) {
                            isAlarmTriggered = true; playAlarm(); document.getElementById('custom-alert').style.display = 'flex'; 
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
