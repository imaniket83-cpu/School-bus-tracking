<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent App - Multi Bus Tracker</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#17a2b8">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6;}
        
        /* AUTH SCREENS - Form hamesha perfectly Center rahega */
        .auth-container { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 30px 15px; box-sizing: border-box; }
        .auth-box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 100%; max-width: 380px; text-align: center; }
        .auth-box h2 { margin-top: 0; color: #17a2b8; margin-bottom: 5px; }
        
        .input-field, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-primary { background-color: #17a2b8; }
        .btn-secondary { background-color: #28a745; margin-bottom: 10px; }
        .btn-warning { background-color: #ffb800; color: #222; margin-top: 20px;}
        .link-text { color: #007bff; cursor: pointer; margin-top: 15px; display: block; font-size: 14px; font-weight: bold; text-decoration: underline;}
        
        .child-entry { background: #f8f9fa; padding: 15px; border-radius: 10px; border: 1px solid #eee; margin-bottom: 15px; text-align: left; position: relative; }
        .child-entry h4 { margin: 0 0 10px 0; color: #444; font-size: 14px; border-bottom: 2px solid #ddd; padding-bottom: 5px; }
        .btn-add-more { background: #e9ecef; color: #333; border: 2px dashed #bbb; margin-bottom: 15px; }
        
        #dashboard-screen { display: none; padding: 20px; max-width: 400px; margin: auto; }
        .child-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 15px; text-align: left; border-left: 5px solid #17a2b8;}
        .child-name { font-size: 18px; font-weight: bold; color: #333; }
        .child-bus { font-size: 14px; color: #666; margin-bottom: 10px; }
        
        #map-screen { display: none; }
        #map { width: 100%; height: 65vh; z-index: 1; }
        .info-panel { padding: 20px; background: white; height: 35vh; box-sizing: border-box; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); border-top-left-radius: 25px; border-top-right-radius: 25px; position: relative; z-index: 1000; margin-top: -20px; text-align: center; }
        .bus-plate { display: inline-block; background: #ffcc00; color: #000; font-weight: bold; padding: 5px 15px; border-radius: 6px; font-size: 15px; border: 2px solid #222; margin-bottom: 10px; }
        .status { font-size: 20px; font-weight: 900; color: #17a2b8; }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="auth-container">
        <div class="auth-box">
            <h2>👪 Parent Login</h2>
            <input type="number" id="login-phone" class="input-field" placeholder="Mobile Number">
            <input type="password" id="login-pass" class="input-field" placeholder="Password">
            <button class="btn btn-primary" onclick="loginParent()">Login</button>
            <span class="link-text" onclick="showScreen('register-screen')">New Parent? Register Here</span>
        </div>
    </div>

    <!-- 2. REGISTRATION SCREEN -->
    <div id="register-screen" class="auth-container" style="display: none;">
        <div class="auth-box">
            <h2>📝 Registration</h2>
            <p style="font-size: 12px; color: #666; margin-top:0; margin-bottom: 15px;">Parent details and all children in one place</p>
            
            <input type="number" id="reg-phone" class="input-field" placeholder="Parent Mobile Number">
            <input type="password" id="reg-pass" class="input-field" placeholder="Create Password">
            
            <div style="border-top: 2px solid #eee; margin: 15px 0;"></div>

            <div id="children-container">
                <div class="child-entry">
                    <h4>Child 1</h4>
                    <input type="text" class="input-field child-name" placeholder="Child's Full Name">
                    <select class="input-field child-bus">
                        <option value="">-- Select Bus --</option>
                        <option value="bus1">Bus 1 (UP 30 AB 1111)</option>
                        <option value="bus2">Bus 2 (UP 30 XY 9999)</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-add-more" onclick="addAnotherChild()">➕ Add Another Child</button>
            
            <button class="btn btn-secondary" onclick="getLocation()" id="loc-btn">📍 Save Home Location</button>
            <p id="loc-status" style="font-size: 12px; color: #28a745; display: none; font-weight:bold;">Location Saved ✅</p>
            
            <button class="btn btn-primary" onclick="registerParent()">Submit All Details</button>
            <span class="link-text" onclick="showScreen('login-screen')">Back to Login</span>
        </div>
    </div>

    <!-- 3. DASHBOARD SCREEN -->
    <div id="dashboard-screen">
        <h2 style="color: #333; text-align:center;">My Children</h2>
        <div id="children-list"></div>
        <button class="btn" style="background:#dc3545; margin-top:20px;" onclick="showScreen('login-screen')">Logout</button>
    </div>

    <!-- 4. MAP TRACKING SCREEN -->
    <div id="map-screen">
        <div id="map"></div>
        <div class="info-panel">
            <h3 style="margin: 0 0 10px 0; color:#333;">🏫 Sandila Public School</h3>
            <div class="bus-plate" id="display-bus">BUS INFO</div>
            <div style="border-top: 2px dashed #eee; margin: 10px 0;"></div>
            <div class="status">Tracking: <span id="display-child-name" style="color:#222;">...</span></div>
            <div style="color: #666; font-size: 14px; margin-top:5px;" id="dist-text">Fetching live location...</div>
            <button class="btn btn-warning" style="margin-top: 15px; padding: 8px;" onclick="showScreen('dashboard-screen')">🔙 Back to Dashboard</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAiBYBGWj1ieiKC5thPuRrnL9zmMHJXQhE",
            authDomain: "schoolbustracking-d2f2d.firebaseapp.com",
            databaseURL: "https://schoolbustracking-d2f2d-default-rtdb.firebaseio.com",
            projectId: "schoolbustracking-d2f2d",
            storageBucket: "schoolbustracking-d2f2d.firebasestorage.app",
            messagingSenderId: "537002829038",
            appId: "1:537002829038:web:cb55b2a25dfc2f4d4ebfff"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();

        let tempLat = null; let tempLng = null;
        let mapInstance = null; let busMarker = null; let activeBusListener = null;
        let childCount = 1;

        function showScreen(screenId) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('register-screen').style.display = 'none';
            document.getElementById('dashboard-screen').style.display = 'none';
            document.getElementById('map-screen').style.display = 'none';
            
            // Yahan fix kiya gaya hai - Login aur Register hamesha center rahenge
            if(screenId === 'login-screen' || screenId === 'register-screen') {
                document.getElementById(screenId).style.display = 'flex';
            } else {
                document.getElementById(screenId).style.display = 'block';
            }
            
            if(screenId !== 'map-screen' && activeBusListener) {
                database.ref('busLocations/' + activeBusListener).off();
                activeBusListener = null;
            }
        }

        function addAnotherChild() {
            childCount++;
            const container = document.getElementById('children-container');
            const newDiv = document.createElement('div');
            newDiv.className = 'child-entry';
            newDiv.innerHTML = `
                <h4>Child ${childCount}</h4>
                <input type="text" class="input-field child-name" placeholder="Child's Full Name">
                <select class="input-field child-bus">
                    <option value="">-- Select Bus --</option>
                    <option value="bus1">Bus 1 (UP 30 AB 1111)</option>
                    <option value="bus2">Bus 2 (UP 30 XY 9999)</option>
                </select>
            `;
            container.appendChild(newDiv);
        }

        function getLocation() {
            const locBtn = document.getElementById('loc-btn');
            locBtn.innerText = "Fetching...";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    tempLat = pos.coords.latitude; tempLng = pos.coords.longitude;
                    locBtn.style.display = 'none'; document.getElementById('loc-status').style.display = 'block';
                }, () => { alert("Please allow location!"); locBtn.innerText = "📍 Save Home Location"; }, { enableHighAccuracy: true });
            }
        }

        function registerParent() {
            let phone = document.getElementById('reg-phone').value.trim();
            let pass = document.getElementById('reg-pass').value.trim();
            if(!phone || !pass) { alert("Enter Parent Mobile and Password!"); return; }
            if(!tempLat || !tempLng) { alert("Save Home Location first!"); return; }

            let childEntries = document.getElementsByClassName('child-entry');
            let childrenData = [];

            for(let i=0; i<childEntries.length; i++) {
                let name = childEntries[i].querySelector('.child-name').value.trim();
                let bus = childEntries[i].querySelector('.child-bus').value;
                if(!name || !bus) {
                    alert(`Please fill Name and select Bus for Child ${i+1}`);
                    return;
                }
                childrenData.push({ name: name, busId: bus });
            }

            let promises = childrenData.map(kid => {
                let childId = "child_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
                return database.ref('students/' + childId).set({
                    name: kid.name, phone: phone, password: pass, busId: kid.busId, status: "pending", stopLat: tempLat, stopLng: tempLng
                });
            });

            Promise.all(promises).then(() => {
                alert("Registration Successful! Please Login.");
                showScreen('login-screen');
                document.getElementById('login-phone').value = phone;
                
                document.getElementById('reg-phone').value = '';
                document.getElementById('reg-pass').value = '';
                document.getElementById('loc-status').style.display = 'none';
                document.getElementById('loc-btn').style.display = 'block';
                document.getElementById('loc-btn').innerText = "📍 Save Home Location";
                tempLat = null; tempLng = null;
                childCount = 1;
                document.getElementById('children-container').innerHTML = `
                    <div class="child-entry">
                        <h4>Child 1</h4>
                        <input type="text" class="input-field child-name" placeholder="Child's Full Name">
                        <select class="input-field child-bus">
                            <option value="">-- Select Bus --</option>
                            <option value="bus1">Bus 1 (UP 30 AB 1111)</option>
                            <option value="bus2">Bus 2 (UP 30 XY 9999)</option>
                        </select>
                    </div>`;
            });
        }

        function loginParent() {
            let phone = document.getElementById('login-phone').value.trim();
            let pass = document.getElementById('login-pass').value.trim();
            if(!phone || !pass) { alert("Enter Phone and Password!"); return; }

            document.getElementById('children-list').innerHTML = "<p>Loading...</p>";
            
            database.ref('students').once('value', (snapshot) => {
                let foundChildren = [];
                snapshot.forEach((childSnap) => {
                    let data = childSnap.val();
                    if(data.phone === phone && data.password === pass) {
                        foundChildren.push({...data, id: childSnap.key});
                    }
                });

                if(foundChildren.length > 0) {
                    showScreen('dashboard-screen');
                    let html = "";
                    foundChildren.forEach(kid => {
                        let busName = kid.busId === 'bus1' ? 'Bus 1 (UP 30 AB 1111)' : 'Bus 2 (UP 30 XY 9999)';
                        html += `
                        <div class="child-card">
                            <div class="child-name">👦 ${kid.name}</div>
                            <div class="child-bus">🚌 Assigned to: ${busName}</div>
                            <button class="btn btn-primary" onclick="trackChild('${kid.name}', '${kid.busId}')">📍 Track ${kid.name}'s Bus</button>
                        </div>`;
                    });
                    document.getElementById('children-list').innerHTML = html;
                } else {
                    alert("No account found or Wrong Password!");
                }
            });
        }

        function trackChild(childName, busId) {
            document.getElementById('display-child-name').innerText = childName;
            document.getElementById('display-bus').innerText = busId.toUpperCase();
            showScreen('map-screen');

            if(!mapInstance) {
                mapInstance = L.map('map').setView([20.5937, 78.9629], 5); 
                L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20 }).addTo(mapInstance);
            }
            
            const busIcon = L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/3063/3063822.png', iconSize: [45, 45], iconAnchor: [22, 22] });
            
            activeBusListener = busId;
            database.ref('busLocations/' + busId).on('value', (snapshot) => {
                const data = snapshot.val();
                if(data) {
                    if(!busMarker) {
                        busMarker = L.marker([data.lat, data.lng], {icon: busIcon}).addTo(mapInstance);
                    } else {
                        busMarker.setLatLng([data.lat, data.lng]);
                    }
                    mapInstance.setView([data.lat, data.lng], 17); 
                    document.getElementById('dist-text').innerText = "Live tracking active...";
                } else {
                    document.getElementById('dist-text').innerText = "Bus has not started the trip yet.";
                }
            });
        }
    </script>
</body>
</html>
