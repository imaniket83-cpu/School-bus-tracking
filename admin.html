<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - School Bus</title>
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#343a40">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        .header { background-color: #343a40; color: white; padding: 18px; text-align: center; font-size: 22px; font-weight: bold; }
        .container { padding: 20px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h3 { margin-top: 0; color: #333; border-bottom: 2px solid #f4f7f6; padding-bottom: 10px; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn { padding: 12px 20px; border: none; border-radius: 5px; font-weight: bold; color: white; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        .btn-add { background-color: #007bff; }
        .btn-reset { background-color: #ffb800; color: #222; }
        .btn-delete { background-color: #dc3545; padding: 6px 12px; font-size: 14px; width: auto; margin-top: 0; }
        .student-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .student-item:last-child { border-bottom: none; }
        .student-info { font-size: 16px; font-weight: bold; color: #333; }
        .student-subtext { font-size: 12px; color: #666; }

        /* NAYA LOGIN SCREEN KA DESIGN */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f4f7f6; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        #login-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 300px; text-align: center; }
        #main-content { display: none; } /* Dashboard tab tak hide rahega jab tak PIN na dale */
    </style>
</head>
<body>

    <!-- NAYA LOGIN SCREEN YAHAN HAI -->
    <div id="login-screen">
        <div id="login-box">
            <h2 style="margin-top: 0;">⚙️ Admin Login</h2>
            <p style="color:#666; font-size:14px;">Enter PIN to access dashboard</p>
            <input type="password" id="admin-pin" placeholder="Enter PIN">
            <button class="btn btn-add" onclick="checkPin()">Login</button>
        </div>
    </div>

    <!-- PURANA ADMIN DASHBOARD YAHAN SE SHURU HOTA HAI -->
    <div id="main-content">
        <div class="header">⚙️ Admin Dashboard</div>
        
        <div class="container">
            <div class="card">
                <h3>Route Management</h3>
                <p style="font-size: 14px; color: #666; margin-bottom: 15px;">Roz subah trip shuru karne se pehle sabhi bacchon ka status 'Pending' karne ke liye click karein.</p>
                <button class="btn btn-reset" onclick="resetAllStatus()">🔄 Reset All to Pending</button>
            </div>

            <div class="card">
                <h3>Add New Student</h3>
                <input type="text" id="stu-id" placeholder="Student ID (e.g., student-03)">
                <input type="text" id="stu-name" placeholder="Full Name (e.g., Priya)">
                <input type="number" id="stu-lat" placeholder="Stop Latitude (e.g., 27.1234)">
                <input type="number" id="stu-lng" placeholder="Stop Longitude (e.g., 80.5432)">
                <button class="btn btn-add" onclick="addStudent()">➕ Add Student</button>
            </div>

            <div class="card">
                <h3>Enrolled Students</h3>
                <div id="admin-student-list">
                    <p style="color: #888;">Loading students...</p>
                </div>
            </div>
        </div>
    </div> <!-- DASHBOARD YAHAN KHATAM HUA -->
