<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin Panel - School Bus</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; }
        
        .navbar { background-color: #1a237e; color: white; padding: 15px 20px; font-size: 22px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .school-name { font-size: 16px; font-weight: normal; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px; }

        .stats-container { display: flex; flex-wrap: wrap; gap: 15px; padding: 20px; }
        .stat-card { flex: 1; min-width: 150px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; border-bottom: 4px solid #ccc; }
        .stat-card h3 { margin: 0; font-size: 32px; color: #333; }
        .stat-card p { margin: 5px 0 0 0; font-size: 14px; color: #666; font-weight: bold; }
        
        .border-blue { border-bottom-color: #0d6efd; }
        .border-yellow { border-bottom-color: #ffc107; }
        .border-green { border-bottom-color: #198754; }
        .border-red { border-bottom-color: #dc3545; }

        .main-grid { display: flex; flex-wrap: wrap; padding: 0 20px 20px 20px; gap: 20px; }
        
        .map-section { flex: 2; min-width: 300px; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); height: 65vh; position: relative; }
        #admin-map { width: 100%; height: 100%; }

        .sidebar { flex: 1; min-width: 250px; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); height: 65vh; overflow-y: auto; box-sizing: border-box; }
        .sidebar h2 { margin-top: 0; color: #1a237e; font-size: 18px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .bus-card { background: #f8f9fa; border-left: 5px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        .bus-title { font-weight: bold; font-size: 16px; color: #222; margin-bottom: 5px; }
        .bus-detail { font-size: 13px; color: #555; margin-bottom: 3px; }
        .bus-shift { display: inline-block; background: #e3f2fd; color: #0d47a1; font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: bold; margin-top: 5px; }
        
        .custom-bus-emoji { background: transparent; border: none; }
    </style>
</head>
<body>

    <div class="navbar">
        <div>📊 Live Dashboard</div>
        <div class="school-name">🏫 Sandila Public School</div>
    </div>

    <div class="stats-container">
        <div class="stat-card border-blue">
            <h3 id="total-students">0</h3><p>Total Students</p>
        </div>
        <div class="stat-card border-yellow">
            <h3 id="waiting-students">0</h3><p>Waiting for Bus</p>
        </div>
        <div class="stat-card border-green">
            <h3 id="boarded-students">0</h3><p>Boarded (Inside)</p>
        </div>
        <div class="stat-card border-red">
            <h3 id="absent-students">0</h3><p>Absent Today</p>
        </div>
    </div>

    <div class="main-grid">
        <div class="map-section">
            <div id="admin-map"></div>
        </div>
        <div class="sidebar">
            <h2>🚍 Fleet Status</h2>
            <div id="active-buses-list">
                <p style="color: #888; font-size: 14px; text-align: center; margin-top: 50px;">Loading fleet data...</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAiBYBGWj1ieiKC5thPuRrnL9zmMHJXQhE", authDomain: "schoolbustracking-d2f2d.firebaseapp.com", databaseURL: "https://schoolbustracking-d2f2d-default-rtdb.firebaseio.com", projectId: "schoolbustracking-d2f2d", storageBucket: "schoolbustracking-d2f2d.firebasestorage.app", messagingSenderId: "537002829038", appId: "1:537002829038:web:cb55b2a25dfc2f4d4ebfff" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();

        let adminMap = L.map('admin-map').setView([20.5937, 78.9629], 5); 
        L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20 }).addTo(adminMap);
        
        let busMarkers = {}; 
        const busIcon = L.divIcon({ html: '<div style="font-size: 35px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">🚌</div>', className: 'custom-bus-emoji', iconSize: [40, 40], iconAnchor: [20, 20], popupAnchor: [0, -20] });

        // Students Analytics
        database.ref('students').on('value', (snapshot) => {
            let total = 0, waiting = 0, boarded = 0, absent = 0;
            snapshot.forEach((child) => {
                total++; let status = child.val().status;
                if(status === 'pending') waiting++;
                else if(status === 'boarded') boarded++;
                else if(status === 'absent') absent++;
            });
            document.getElementById('total-students').innerText = total; document.getElementById('waiting-students').innerText = waiting;
            document.getElementById('boarded-students').innerText = boarded; document.getElementById('absent-students').innerText = absent;
        });

        // NAYA LOGIC: Pehle saari registered buses laao, fir locations se compare karo
        let allRegisteredBuses = {};
        let liveLocations = {};

        database.ref('buses').on('value', snap => {
            allRegisteredBuses = snap.val() || {};
            updateDashboard();
        });

        database.ref('busLocations').on('value', snap => {
            liveLocations = snap.val() || {};
            updateDashboard();
        });

        function updateDashboard() {
            let activeHTML = "";
            let inactiveHTML = "";
            let bounds = []; 
            let activeCount = 0;
            let inactiveCount = 0;

            for(let busId in allRegisteredBuses) {
                let busData = allRegisteredBuses[busId];
                let loc = liveLocations[busId];
                
                // Agar 12 ghante ke andar ki location hai, toh ACTIVE maano
                let isActive = loc && loc.lat && (Date.now() - loc.timestamp < 12 * 60 * 60 * 1000);

                if(isActive) {
                    activeCount++;
                    if(!busMarkers[busId]) {
                        busMarkers[busId] = L.marker([loc.lat, loc.lng], {icon: busIcon}).addTo(adminMap);
                    } else {
                        busMarkers[busId].setLatLng([loc.lat, loc.lng]);
                    }
                    busMarkers[busId].bindPopup(`<b>${busData.name}</b><br>Driver: ${loc.driverName}`);
                    bounds.push([loc.lat, loc.lng]);

                    activeHTML += `
                        <div class="bus-card" style="border-left-color: #28a745;">
                            <div class="bus-title" style="color: #155724;">🟢 ${busData.name}</div>
                            <div class="bus-detail">👨‍✈️ Driver: <b>${loc.driverName}</b></div>
                            <div class="bus-detail">📞 Phone: <a href="tel:${loc.driverPhone}" style="color:#007bff; text-decoration:none;">${loc.driverPhone}</a></div>
                            <div class="bus-shift">${loc.shift}</div>
                        </div>`;
                } else {
                    inactiveCount++;
                    // Agar purana marker map par hai toh hatao
                    if(busMarkers[busId]) {
                        adminMap.removeLayer(busMarkers[busId]);
                        delete busMarkers[busId];
                    }

                    inactiveHTML += `
                        <div class="bus-card" style="border-left-color: #dc3545; background-color: #fff5f5;">
                            <div class="bus-title" style="color: #dc3545;">🔴 ${busData.name}</div>
                            <div class="bus-detail" style="color:#666;">Status: <b style="color:#dc3545;">Duty Not Started</b></div>
                            <div class="bus-detail" style="font-size:11px; margin-top:5px; color:#888;">(Admin Action Required)</div>
                        </div>`;
                }
            }

            let finalDisplay = "";
            if(activeCount > 0) finalDisplay += `<h3 style="color:#28a745; margin-top:0; font-size:15px; border-bottom:1px solid #ccc; padding-bottom:5px;">Active on Route (${activeCount})</h3>` + activeHTML;
            if(inactiveCount > 0) finalDisplay += `<h3 style="color:#dc3545; margin-top:20px; font-size:15px; border-bottom:1px solid #ccc; padding-bottom:5px;">Inactive / Offline (${inactiveCount})</h3>` + inactiveHTML;
            
            if(activeCount === 0 && inactiveCount === 0) finalDisplay = `<p style="color: #888; font-size: 14px; text-align: center; margin-top: 50px;">No buses registered in system.</p>`;

            document.getElementById('active-buses-list').innerHTML = finalDisplay;
            if(bounds.length > 0) adminMap.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
        }
    </script>
</body>
</html>
