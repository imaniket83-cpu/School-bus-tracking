<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver App - Premium Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        .header { background-color: #ffb800; color: #222; padding: 18px; text-align: center; font-size: 20px; font-weight: 800; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        .container { padding: 15px; padding-bottom: 40px; }
        .card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); border-left: 5px solid #ccc; transition: 0.3s; }
        .card.active { border-left-color: #28a745; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .student-name { font-size: 18px; font-weight: bold; color: #333; }
        .badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: bold; }
        .badge.pending { background: #fff3cd; color: #856404; }
        .badge.boarded { background: #d4edda; color: #155724; }
        .distance-text { font-size: 14px; color: #666; margin-bottom: 15px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; color: white; background-color: #e0e0e0; cursor: not-allowed; transition: 0.3s; }
        .btn.ready { background-color: #28a745; box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3); cursor: pointer; }
        .btn.ready:active { transform: scale(0.98); }
        .btn.done { background-color: #6c757d; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="header">🚍 Morning Route</div>
    <div class="container" id="student-list">
        <div style="text-align:center; margin-top:30px; color:#888;">Fetching student list...</div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="app.js"></script>
</body>
</html>
