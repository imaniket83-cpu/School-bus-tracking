<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver App - Premium Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        .header { background-color: #ffb800; color: #222; padding: 18px; text-align: center; font-size: 20px; font-weight: 800; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        .container { padding: 15px; padding-bottom: 40px; }
        .card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); border-left: 5px solid #ccc; transition: 0.3s; }
        .card.active { border-left-color: #28a745; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .student-name { font-size: 18px; font-weight: bold; color: #333; }
        .badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: bold; }
        .badge.pending { background: #fff3cd; color: #856404; }
        .badge.boarded { background: #d4edda; color: #155724; }
        .distance-text { font-size: 14px; color: #666; margin-bottom: 15px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; color: white; background-color: #e0e0e0; cursor: not-allowed; transition: 0.3s; }
        .btn.ready { background-color: #28a745; box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3); cursor: pointer; }
        .btn.ready:active { transform: scale(0.98); }
        .btn.done { background-color: #6c757d; cursor: not-allowed; }

        /* NAYA LOGIN SCREEN CSS */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f4f7f6; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        #login-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 300px; text-align: center; }
        #main-content { display: none; }
        .login-btn { background-color: #28a745; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; margin-top: 10px; }
        .login-input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; text-align: center; font-size: 18px; letter-spacing: 2px; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div id="login-box">
            <h2 style="margin-top: 0; color: #333;">🚌 Driver Login</h2>
            <p style="color:#666; font-size:14px;">Enter PIN to start route</p>
            <input type="password" id="driver-pin" class="login-input" placeholder="****">
            <button class="login-btn" onclick="checkDriverPin()">Start Route</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="main-content">
        <div class="header">🚍 Morning Route</div>
        <div class="container" id="student-list">
            <div style="text-align:center; margin-top:30px; color:#888;">Fetching student list...</div>
        </div>
    </div>

    <script>
        window.checkDriverPin = function() {
            let pin = document.getElementById('driver-pin').value;
            if(pin === "1234") { 
                document.getElementById('login-screen').style.display = "none";
                document.getElementById('main-content').style.display = "block";
            } else {
                alert("Wrong PIN! Try again.");
            }
        }
    </script>

    <!-- Firebase SDKs & App.js -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="app.js"></script>

</body>
</html>
