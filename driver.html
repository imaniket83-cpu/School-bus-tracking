<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver App - School Bus</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffb800">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f4f7f6; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        #login-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 320px; text-align: center; }
        
        .input-field { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; text-align: center; }
        .login-btn { background-color: #28a745; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .login-btn:active { transform: scale(0.98); }
        
        #main-content { display: none; }
        .header { background-color: #ffb800; color: #222; padding: 15px; text-align: center; font-size: 16px; font-weight: 800; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        .container { padding: 15px; padding-bottom: 40px; }
        
        .card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); border-left: 5px solid #ccc; transition: 0.3s; }
        .card.active { border-left-color: #28a745; }
        .card.absent { border-left-color: #dc3545; opacity: 0.8; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .student-name { font-size: 18px; font-weight: bold; color: #333; }
        
        .badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: bold; }
        .badge.pending { background: #fff3cd; color: #856404; }
        .badge.boarded { background: #d4edda; color: #155724; }
        .badge.absent { background: #f8d7da; color: #721c24; }
        
        .distance-text { font-size: 14px; color: #666; margin-bottom: 15px; }
        .btn-board { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; color: white; background-color: #007bff; cursor: pointer; transition: 0.3s; }
        .btn-board.done { background-color: #6c757d; cursor: not-allowed; }
        .btn-board.absent-btn { background-color: #dc3545; cursor: not-allowed; }

        .btn-end-duty { width: 90%; margin: 15px 5%; padding: 12px; background-color: #dc3545; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div id="login-box">
            <h2 style="margin-top: 0; color: #333;">🚌 Driver Duty</h2>
            <p style="color:#666; font-size:14px; margin-bottom: 15px;">Start your route</p>
            
            <input type="text" id="driver-name" class="input-field" placeholder="Driver Name">
            <input type="number" id="driver-phone" class="input-field" placeholder="Phone Number">
            
            <div style="border-top: 2px dashed #eee; margin: 15px 0;"></div>

            <select id="driver-shift" class="input-field" style="background:#e3f2fd; color:#0d47a1; font-weight:bold;">
                <option value="Morning Pickup">🌅 Morning Pickup</option>
                <option value="Evening Drop">🌇 Evening Drop</option>
            </select>

            <select id="driver-bus" class="input-field" style="font-weight: bold; color: #222;">
                <option value="">-- Loading Buses... --</option>
            </select>
            
            <input type="password" id="driver-pin" class="input-field" placeholder="Enter PIN (1234)">
            
            <button class="login-btn" onclick="window.startDuty()">Start Route & GPS</button>
            <p id="gps-status" style="font-size: 13px; color: #dc3545; display: none; margin-top: 15px;">Locating GPS...</p>
        </div>
    </div>

    <div id="main-content">
        <div class="header" id="bus-header">🚍 Route Started</div>
        
        <button class="btn-end-duty" onclick="window.endDuty()">🛑 End Duty & Logout</button>

        <div class="container" id="student-list">
            <div style="text-align:center; margin-top:30px; color:#888;">Fetching students for this bus...</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyAiBYBGWj1ieiKC5thPuRrnL9zmMHJXQhE", 
            authDomain: "schoolbustracking-d2f2d.firebaseapp.com", 
            databaseURL: "https://schoolbustracking-d2f2d-default-rtdb.firebaseio.com", 
            projectId: "schoolbustracking-d2f2d", 
            storageBucket: "schoolbustracking-d2f2d.firebasestorage.app", 
            messagingSenderId: "537002829038", 
            appId: "1:537002829038:web:cb55b2a25dfc2f4d4ebfff" 
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();
        
        let currentBusId = null;
        let watchId = null;
        let globalBuses = {}; 

        database.ref('buses').on('value', snap => {
            globalBuses = snap.val() || {};
            let busSelect = document.getElementById('driver-bus');
            busSelect.innerHTML = '<option value="">-- Select Bus --</option>';
            for(let key in globalBuses) {
                busSelect.innerHTML += `<option value="${key}">${globalBuses[key].name}</option>`;
            }
        });

        window.onload = function() {
            setTimeout(() => {
                let savedBus = localStorage.getItem('driverBus');
                let savedName = localStorage.getItem('driverName');
                if(savedBus && savedName) {
                    document.getElementById('driver-name').value = savedName;
                    document.getElementById('driver-phone').value = localStorage.getItem('driverPhone');
                    document.getElementById('driver-shift').value = localStorage.getItem('driverShift');
                    document.getElementById('driver-bus').value = savedBus;
                    document.getElementById('driver-pin').value = "1234";
                    window.startDuty(true);
                }
            }, 1000); 
        };

        window.startDuty = function(isAutoStart = false) {
            let name = document.getElementById('driver-name').value.trim();
            let phone = document.getElementById('driver-phone').value.trim();
            let shift = document.getElementById('driver-shift').value;
            let busId = document.getElementById('driver-bus').value;
            let pin = document.getElementById('driver-pin').value;

            if(!isAutoStart) {
                if(!name || !phone || !busId) { alert("Fill all details!"); return; }
                if(pin !== "1234") { alert("Wrong PIN!"); return; }
                localStorage.setItem('driverName', name); localStorage.setItem('driverPhone', phone);
                localStorage.setItem('driverShift', shift); localStorage.setItem('driverBus', busId);
            }

            currentBusId = busId;
            document.getElementById('gps-status').style.display = 'block';

            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        document.getElementById('login-screen').style.display = "none";
                        document.getElementById('main-content').style.display = "block";
                        
                        let busLabel = globalBuses[busId] ? globalBuses[busId].name : busId;
                        document.getElementById('bus-header').innerHTML = `${shift}<br>🚍 ${busLabel} | Driver: ${name}`;

                        database.ref('busLocations/' + currentBusId).set({
                            lat: position.coords.latitude, lng: position.coords.longitude, timestamp: Date.now(),
                            driverName: name, driverPhone: phone, shift: shift
                        });
                    }, 
                    (error) => { alert("Turn on GPS/Location!"); document.getElementById('gps-status').style.display = 'none'; }, 
                    { enableHighAccuracy: true }
                );

                if(!isAutoStart) {
                    let todayDate = new Date().toDateString();
                    database.ref('students').once('value', snapshot => {
                        let updates = {};
                        snapshot.forEach(childSnap => {
                            let data = childSnap.val();
                            if(data.busId === currentBusId) {
                                // Agar boarded tha kal ya absent ka purana date hai, toh reset kardo naye login par
                                if(data.status !== 'absent' || (data.status === 'absent' && data.absentDate !== todayDate)) {
                                    updates[childSnap.key + '/status'] = 'pending';
                                    updates[childSnap.key + '/absentDate'] = null;
                                }
                            }
                        });
                        if(Object.keys(updates).length > 0) database.ref('students').update(updates);
                    });
                }
                window.loadStudentsForBus(currentBusId);
            } else { alert("GPS tracking not supported."); }
        };

        window.endDuty = function() {
            if(confirm("Are you sure you want to end today's duty and logout?")) {
                if(currentBusId) { database.ref('busLocations/' + currentBusId).remove(); }
                localStorage.removeItem('driverName'); localStorage.removeItem('driverPhone');
                localStorage.removeItem('driverShift'); localStorage.removeItem('driverBus');
                if(watchId) { navigator.geolocation.clearWatch(watchId); }
                document.getElementById('main-content').style.display = 'none';
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('gps-status').style.display = 'none';
                document.getElementById('driver-name').value = ''; document.getElementById('driver-phone').value = '';
                document.getElementById('driver-bus').value = ''; document.getElementById('driver-pin').value = '';
            }
        };

        window.loadStudentsForBus = function(busId) {
            database.ref('students').on('value', (snapshot) => {
                const listDiv = document.getElementById('student-list');
                listDiv.innerHTML = ''; let count = 0;
                snapshot.forEach((childSnap) => {
                    let student = childSnap.val(); let studentId = childSnap.key;
                    if(student.busId === busId) {
                        count++;
                        
                        // SMART DATE AUTO-RESET LOGIC
                        let todayDate = new Date().toDateString();
                        let isAbsent = false;
                        
                        if(student.status === 'absent') {
                            if(student.absentDate === todayDate) {
                                isAbsent = true;
                            } else {
                                database.ref('students/' + studentId).update({ status: 'pending', absentDate: null });
                            }
                        }
                        
                        let isBoarded = student.status === "boarded";
                        let badgeClass = "badge pending"; let badgeText = "Waiting"; let cardClass = "card active";
                        let btnHtml = `<button class="btn-board" onclick="window.markBoarded('${studentId}')">Mark as Boarded</button>`;

                        if (isAbsent) {
                            badgeClass = "badge absent"; badgeText = "Absent Today"; cardClass = "card absent";
                            btnHtml = `<button class="btn-board absent-btn" disabled>Student on Leave</button>`;
                        } else if (isBoarded) {
                            badgeClass = "badge boarded"; badgeText = "Boarded"; cardClass = "card";
                            btnHtml = `<button class="btn-board done" disabled>Already Boarded</button>`;
                        }

                        listDiv.innerHTML += `
                            <div class="${cardClass}">
                                <div class="card-header"><div class="student-name">${student.name}</div><div class="${badgeClass}">${badgeText}</div></div>
                                <div class="distance-text">📞 ${student.phone}</div>${btnHtml}
                            </div>`;
                    }
                });
                if(count === 0) listDiv.innerHTML = `<div style="text-align:center; color:#888;">No students assigned.</div>`;
            });
        };

        window.markBoarded = function(studentId) { database.ref('students/' + studentId + '/status').set('boarded'); };
    </script>
</body>
</html>
