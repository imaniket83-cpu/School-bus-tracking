<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver App - School Bus</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffb800">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        
        /* LOGIN SCREEN CSS */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f4f7f6; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        #login-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 320px; text-align: center; }
        
        .input-field { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; text-align: center; }
        .login-btn { background-color: #28a745; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .login-btn:active { transform: scale(0.98); }
        
        /* MAIN DASHBOARD */
        #main-content { display: none; }
        .header { background-color: #ffb800; color: #222; padding: 18px; text-align: center; font-size: 20px; font-weight: 800; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        .container { padding: 15px; padding-bottom: 40px; }
        
        .card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); border-left: 5px solid #ccc; transition: 0.3s; }
        .card.active { border-left-color: #28a745; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .student-name { font-size: 18px; font-weight: bold; color: #333; }
        
        .badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: bold; }
        .badge.pending { background: #fff3cd; color: #856404; }
        .badge.boarded { background: #d4edda; color: #155724; }
        
        .distance-text { font-size: 14px; color: #666; margin-bottom: 15px; }
        .btn-board { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; color: white; background-color: #007bff; cursor: pointer; transition: 0.3s; }
        .btn-board.done { background-color: #6c757d; cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen">
        <div id="login-box">
            <h2 style="margin-top: 0; color: #333;">🚌 Driver Duty</h2>
            <p style="color:#666; font-size:14px; margin-bottom: 20px;">Select your bus for today's route</p>
            
            <!-- Bus Selection Dropdown -->
            <select id="driver-bus" class="input-field" style="font-weight: bold; color: #222;">
                <option value="">-- Select Bus --</option>
                <option value="bus1">Bus 1 (UP 30 AB 1111)</option>
                <option value="bus2">Bus 2 (UP 30 XY 9999)</option>
            </select>
            
            <input type="password" id="driver-pin" class="input-field" placeholder="Enter PIN (e.g. 1234)">
            
            <button class="login-btn" onclick="window.startDuty()">Start Route & GPS</button>
            <p id="gps-status" style="font-size: 13px; color: #dc3545; display: none; margin-top: 15px;">Locating GPS...</p>
        </div>
    </div>

    <!-- 2. MAIN DASHBOARD -->
    <div id="main-content">
        <div class="header" id="bus-header">🚍 Route Started</div>
        <div class="container" id="student-list">
            <div style="text-align:center; margin-top:30px; color:#888;">Fetching students for this bus...</div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAiBYBGWj1ieiKC5thPuRrnL9zmMHJXQhE",
            authDomain: "schoolbustracking-d2f2d.firebaseapp.com",
            databaseURL: "https://schoolbustracking-d2f2d-default-rtdb.firebaseio.com",
            projectId: "schoolbustracking-d2f2d",
            storageBucket: "schoolbustracking-d2f2d.firebasestorage.app",
            messagingSenderId: "537002829038",
            appId: "1:537002829038:web:cb55b2a25dfc2f4d4ebfff"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();
        
        let currentBusId = null;
        let watchId = null;

        // Function 1: Login and Start Duty
        window.startDuty = function() {
            let busId = document.getElementById('driver-bus').value;
            let pin = document.getElementById('driver-pin').value;

            if(!busId) { alert("Please select a Bus!"); return; }
            if(pin !== "1234") { alert("Wrong PIN! Try again."); return; }

            currentBusId = busId;
            document.getElementById('gps-status').style.display = 'block';

            // Start GPS Tracking for Selected Bus
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        // GPS Lock ho gaya, ab dashboard dikhao
                        document.getElementById('login-screen').style.display = "none";
                        document.getElementById('main-content').style.display = "block";
                        
                        let busLabel = busId === 'bus1' ? 'Bus 1' : 'Bus 2';
                        document.getElementById('bus-header').innerText = `🚍 ${busLabel} Route`;

                        // Firebase me is Bus ki live location save karo
                        database.ref('busLocations/' + currentBusId).set({
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                            timestamp: Date.now()
                        });
                    }, 
                    (error) => {
                        alert("GPS Error: Please turn on Location/GPS on your phone!");
                        document.getElementById('gps-status').style.display = 'none';
                    }, 
                    { enableHighAccuracy: true }
                );

                // Sirf is specific bus ke baccho ko list me fetch karo
                loadStudentsForBus(currentBusId);
            } else {
                alert("Your browser does not support GPS tracking.");
            }
        };

        // Function 2: Load Students specific to the selected Bus
        window.loadStudentsForBus = function(busId) {
            database.ref('students').on('value', (snapshot) => {
                const listDiv = document.getElementById('student-list');
                listDiv.innerHTML = '';
                
                let count = 0;
                snapshot.forEach((childSnap) => {
                    let student = childSnap.val();
                    let studentId = childSnap.key;
                    
                    // Filter: Sirf wahi bacche dikhao jo is bus me assign hain
                    if(student.busId === busId) {
                        count++;
                        let isBoarded = student.status === "boarded";
                        let badgeClass = isBoarded ? "badge boarded" : "badge pending";
                        let badgeText = isBoarded ? "Boarded" : "Waiting";
                        
                        let btnHtml = isBoarded 
                            ? `<button class="btn-board done" disabled>Already Boarded</button>`
                            : `<button class="btn-board" onclick="window.markBoarded('${studentId}')">Mark as Boarded</button>`;

                        listDiv.innerHTML += `
                            <div class="card ${isBoarded ? '' : 'active'}">
                                <div class="card-header">
                                    <div class="student-name">${student.name}</div>
                                    <div class="${badgeClass}">${badgeText}</div>
                                </div>
                                <div class="distance-text">📞 ${student.phone}</div>
                                ${btnHtml}
                            </div>
                        `;
                    }
                });

                if(count === 0) {
                    listDiv.innerHTML = `<div style="text-align:center; color:#888;">No students assigned to this bus yet.</div>`;
                }
            });
        };

        // Function 3: Mark Student as Boarded
        window.markBoarded = function(studentId) {
            database.ref('students/' + studentId + '/status').set('boarded');
        };
    </script>
</body>
</html>
